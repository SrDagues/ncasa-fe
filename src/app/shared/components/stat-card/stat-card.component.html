<div
  class="rounded-2xl border p-5 shadow-soft"
  [ngClass]="tone === 'forest' ? 'bg-ncasa-forest border-ncasa-forest' : 'bg-ncasa-surface border-ncasa-border'"
>
  <div class="flex items-start justify-between gap-3">
    <p class="text-sm font-medium" [ngClass]="tone === 'forest' ? 'text-ncasa-cream/70' : 'text-ncasa-muted'">
      {{ label }}
    </p>
    <span *ngIf="icon" class="flex h-9 w-9 items-center justify-center rounded-xl" [ngClass]="iconWrap">
      <lucide-icon [name]="icon" [size]="18" aria-hidden="true"></lucide-icon>
    </span>
  </div>
  <p class="mt-3 text-2xl font-semibold tabular" [ngClass]="valueClass">{{ value }}</p>
  <p *ngIf="caption" class="mt-1 text-xs" [ngClass]="tone === 'forest' ? 'text-ncasa-cream/60' : 'text-ncasa-muted'">
    {{ caption }}
  </p>
</div>
