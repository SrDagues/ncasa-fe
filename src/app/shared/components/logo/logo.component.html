<div class="flex items-center gap-3">
  <!-- Isotype: two people rising from a house/roof. Reserved SVG mark. -->
  <svg
    *ngIf="variant !== 'wordmark'"
    [ngClass]="markSize"
    viewBox="0 0 64 64"
    fill="none"
    role="img"
    aria-label="ncasa"
    xmlns="http://www.w3.org/2000/svg"
  >
    <!-- Sage house / roof behind the figures -->
    <path
      d="M20 62 L20 40 L32 30 L44 40 L44 62 Z"
      fill="#9DB9A7"
    />
    <!-- Left figure (forest) -->
    <circle cx="20" cy="14" r="8" fill="#123C36" />
    <path
      d="M8 44 C8 32 14 26 20 26 C26 26 32 32 32 44 L32 62 L8 62 Z"
      fill="#123C36"
    />
    <!-- Right figure (coral), overlapping -->
    <circle cx="40" cy="16" r="8" fill="#F26B5B" />
    <path
      d="M30 46 C30 34 34 28 40 28 C46 28 52 34 52 46 L52 62 L30 62 Z"
      fill="#F26B5B"
    />
    <!-- Small forest wedge where they overlap for depth -->
    <path
      d="M30 46 C30 40 31 36 32 33 C33 36 32 42 32 46 L32 62 L30 62 Z"
      fill="#123C36"
      opacity="0.35"
    />
  </svg>

  <div *ngIf="variant !== 'mark'" class="flex flex-col leading-none">
    <span [ngClass]="[wordSize, wordColor]" class="font-semibold tracking-tight">ncasa</span>
    <span *ngIf="variant === 'full'" [ngClass]="tagColor" class="mt-1 text-xs font-normal">
      Vida en común
    </span>
  </div>
</div>
