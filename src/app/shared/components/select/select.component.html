<div class="relative">
  <select
    [id]="id"
    [disabled]="disabled"
    [value]="value()"
    (change)="change($event)"
    class="h-11 w-full appearance-none rounded-xl border border-ncasa-border bg-ncasa-surface pl-4 pr-10 text-sm text-ncasa-charcoal transition-colors duration-150 focus:border-ncasa-forest focus:outline-none focus-visible:ring-2 focus-visible:ring-ncasa-forest focus-visible:ring-offset-2 focus-visible:ring-offset-ncasa-cream disabled:cursor-not-allowed disabled:opacity-60"
  >
    <option *ngFor="let opt of options" [value]="opt.value">
      {{ opt.label }}
    </option>
  </select>
  <lucide-icon
    name="chevron-down"
    [size]="18"
    class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-ncasa-muted"
    aria-hidden="true"
  ></lucide-icon>
</div>
