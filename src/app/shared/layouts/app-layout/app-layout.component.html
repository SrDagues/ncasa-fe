<div class="min-h-screen bg-ncasa-cream">
  <!-- Desktop sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-30 hidden w-64 flex-col border-r border-ncasa-border bg-ncasa-surface lg:flex"
  >
    <div class="flex h-16 items-center px-6">
      <a routerLink="/app/dashboard" class="inline-flex rounded-xl">
        <app-logo variant="wordmark" size="sm"></app-logo>
      </a>
    </div>

    <nav class="flex-1 px-3 py-4" [attr.aria-label]="'navigation.primary' | translate">
      <ul class="space-y-1">
        <li *ngFor="let item of nav">
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-ncasa-forest text-ncasa-cream hover:!bg-ncasa-forest"
            class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-ncasa-charcoal transition-colors hover:bg-ncasa-sage-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ncasa-forest"
          >
            <lucide-icon [name]="item.icon" [size]="19" aria-hidden="true"></lucide-icon>
            {{ item.labelKey | translate }}
          </a>
        </li>
      </ul>
    </nav>

    <div class="border-t border-ncasa-border p-3">
      <div class="flex items-center gap-3 rounded-xl px-3 py-2">
        <app-avatar initials="DA" name="Dani" color="bg-ncasa-forest text-ncasa-cream" size="md"></app-avatar>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-ncasa-charcoal">Dani</p>
          <p class="truncate text-xs text-ncasa-muted">{{ 'demo.household' | translate }}</p>
        </div>
        <button
          type="button"
          (click)="logout()"
          [disabled]="logoutPending()"
          class="inline-flex h-9 w-9 items-center justify-center rounded-xl text-ncasa-muted transition-colors hover:bg-ncasa-sage-soft hover:text-ncasa-forest focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ncasa-forest"
          [attr.aria-label]="'layout.logout' | translate"
        >
          <lucide-icon name="log-out" [size]="18" aria-hidden="true"></lucide-icon>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main column -->
  <div class="lg:pl-64">
    <!-- Top bar -->
    <header
      class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-ncasa-border bg-ncasa-cream/90 px-5 backdrop-blur sm:px-8"
    >
      <a routerLink="/app/dashboard" class="inline-flex rounded-xl lg:hidden">
        <app-logo variant="mark" size="sm"></app-logo>
      </a>
      <div class="hidden lg:block">
        <p class="text-sm text-ncasa-muted">{{ 'layout.welcome' | translate }}</p>
      </div>
      <div class="flex items-center gap-2">
        <app-language-switcher />
        <app-icon-button icon="bell" [label]="'layout.notifications' | translate" variant="secondary"></app-icon-button>
        <a
          routerLink="/app/household"
          class="inline-flex h-11 items-center gap-2 rounded-xl border border-ncasa-border bg-ncasa-surface px-3 text-sm font-medium text-ncasa-forest transition-colors hover:bg-ncasa-sage-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ncasa-forest"
        >
          <span class="flex h-6 w-6 items-center justify-center rounded-lg bg-ncasa-sage-soft">
            <lucide-icon name="home" [size]="14" aria-hidden="true"></lucide-icon>
          </span>
          <span class="hidden sm:inline">{{ 'demo.household' | translate }}</span>
          <lucide-icon name="chevron-down" [size]="16" class="text-ncasa-muted" aria-hidden="true"></lucide-icon>
        </a>
      </div>
    </header>

    <!-- Routed content -->
    <main class="mx-auto w-full max-w-5xl px-5 pb-28 pt-6 sm:px-8 lg:pb-12">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile bottom navigation -->
  <nav
    class="fixed inset-x-0 bottom-0 z-30 border-t border-ncasa-border bg-ncasa-surface/95 backdrop-blur lg:hidden"
    [attr.aria-label]="'navigation.primary' | translate"
  >
    <ul class="mx-auto flex max-w-lg items-stretch justify-between px-2">
      <li *ngFor="let item of nav" class="flex-1">
        <a
          [routerLink]="item.path"
          routerLinkActive="text-ncasa-forest"
          #rla="routerLinkActive"
          class="flex min-h-[56px] flex-col items-center justify-center gap-1 px-1 py-2 text-[11px] font-medium text-ncasa-muted transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ncasa-forest"
        >
          <span
            class="flex h-8 w-12 items-center justify-center rounded-full transition-colors"
            [ngClass]="rla.isActive ? 'bg-ncasa-sage-soft' : ''"
          >
            <lucide-icon [name]="item.icon" [size]="20" aria-hidden="true"></lucide-icon>
          </span>
          {{ item.labelKey | translate }}
        </a>
      </li>
    </ul>
  </nav>
</div>
