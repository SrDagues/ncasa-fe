<section class="auth-form" aria-labelledby="login-title">
  <header class="auth-form__header">
    <h1 id="login-title" class="auth-form__title">Bienvenido de nuevo</h1>
    <p class="auth-form__subtitle">Entra para ver qué pasa hoy en casa.</p>
  </header>

  <form (ngSubmit)="submit()">
    <div class="form-field">
      <label for="login-email">Correo electrónico</label>
      <div class="input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        <input id="login-email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" [(ngModel)]="email" required>
      </div>
    </div>

    <div class="form-field">
      <label for="login-password">Contraseña</label>
      <div class="input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="login-password" name="password" [type]="showPassword ? 'text' : 'password'" placeholder="Tu contraseña" autocomplete="current-password" [(ngModel)]="password" required>
        <button class="input-shell__action" type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.1 12a10.9 10.9 0 0 1 19.8 0 10.9 10.9 0 0 1-19.8 0Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="form-options">
      <label class="checkbox"><input name="remember" type="checkbox" [(ngModel)]="remember"> Recuérdame</label>
      <a href="#" class="text-link">¿Olvidaste la contraseña?</a>
    </div>

    <button class="primary-button" type="submit">Entrar en casa</button>
  </form>

  <p class="auth-form__footer">¿Aún no tienes hogar? <a routerLink="/register" class="text-link">Crea el tuyo</a></p>
</section>
