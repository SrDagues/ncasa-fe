<section class="flex flex-col gap-6">
  <header class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-ncasa-forest sm:text-3xl">Calendario</h1>
      <p class="mt-1 text-sm text-ncasa-muted">Pagos, tareas y planes del hogar.</p>
    </div>
    <app-button variant="primary" icon="calendar-plus">Nuevo evento</app-button>
  </header>

  <!-- Legend -->
  <div class="flex flex-wrap gap-x-5 gap-y-2">
    <span *ngFor="let c of categories" class="inline-flex items-center gap-2 text-sm text-ncasa-charcoal">
      <span class="h-2.5 w-2.5 rounded-full" [ngClass]="c.dot"></span>
      {{ c.label }}
    </span>
  </div>

  <div class="grid gap-6 lg:grid-cols-5">
    <!-- Month grid -->
    <app-card padding="none" class="lg:col-span-3">
      <div class="flex items-center justify-between border-b border-ncasa-border px-5 py-4">
        <h2 class="text-base font-semibold text-ncasa-forest">{{ monthLabel }}</h2>
        <div class="flex items-center gap-2">
          <app-icon-button icon="chevron-left" label="Mes anterior" variant="secondary" size="sm"></app-icon-button>
          <app-icon-button icon="chevron-right" label="Mes siguiente" variant="secondary" size="sm"></app-icon-button>
        </div>
      </div>

      <div class="p-4">
        <div class="grid grid-cols-7 gap-1">
          <span
            *ngFor="let w of weekdays"
            class="pb-2 text-center text-xs font-semibold uppercase tracking-wide text-ncasa-muted"
          >
            {{ w }}
          </span>

          <div
            *ngFor="let cell of grid"
            class="flex min-h-[64px] flex-col rounded-xl p-1.5"
            [ngClass]="cell.day === null
              ? ''
              : (cell.isToday ? 'bg-ncasa-forest text-ncasa-cream' : 'hover:bg-ncasa-sage-soft')"
          >
            <ng-container *ngIf="cell.day !== null">
              <span
                class="text-xs font-medium"
                [ngClass]="cell.isToday ? 'text-ncasa-cream' : 'text-ncasa-charcoal'"
              >
                {{ cell.day }}
              </span>
              <span class="mt-auto flex flex-wrap gap-1 pt-1">
                <span
                  *ngFor="let ev of cell.events"
                  class="h-1.5 w-1.5 rounded-full"
                  [ngClass]="cell.isToday ? 'bg-ncasa-cream' : dot(ev)"
                ></span>
              </span>
            </ng-container>
          </div>
        </div>
      </div>
    </app-card>

    <!-- Agenda -->
    <app-card padding="none" class="lg:col-span-2">
      <div class="border-b border-ncasa-border px-5 py-4">
        <h2 class="text-base font-semibold text-ncasa-forest">Próximos eventos</h2>
      </div>
      <ul class="divide-y divide-ncasa-border">
        <li *ngFor="let e of events; trackBy: trackEvent" class="flex items-start gap-3 px-5 py-4">
          <span class="mt-1 h-2.5 w-2.5 shrink-0 rounded-full" [ngClass]="dot(e.category)"></span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-ncasa-charcoal">{{ e.title }}</p>
            <p class="mt-0.5 text-xs text-ncasa-muted">{{ e.dateLabel }}<span *ngIf="e.time"> · {{ e.time }}</span></p>
          </div>
          <span class="rounded-full px-2.5 py-1 text-xs font-medium" [ngClass]="chip(e.category)">
            {{ categoryLabel(e.category) }}
          </span>
        </li>
      </ul>
    </app-card>
  </div>
</section>
